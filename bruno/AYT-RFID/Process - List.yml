info:
  name: Process - List
  type: http
  seq: 9

http:
  method: GET
  url: "{{urlPrefix}}/api/assembly/process"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  List processes, ordered by process_code.

  ### 200 With rows
  ```json
  [
    { "id": 1, "process_code": "1400", "process_name": "BEFORE ISSUE" },
    { "id": 2, "process_code": "1500", "process_name": "GAUGING" }
  ]
  ```

  ### 200 Empty
  ```json
  []
  ```

  ### 500 Database error
  ```json
  { "error": "Failed to connect to database" }
  ```
