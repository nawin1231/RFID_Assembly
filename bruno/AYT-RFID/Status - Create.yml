info:
  name: Status - Create
  type: http
  seq: 6

http:
  method: POST
  url: "{{urlPrefix}}/api/assembly/status"
  body:
    type: json
    data: |-
      {
        "status": "test_status",
        "label_status": "Test Status",
        "process_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Create a status. `process_id` is optional (null if missing).
  A database error comes back as HTTP 200 with the message in `result`.

  ### 200 Created
  ```json
  { "result": "OK" }
  ```

  ### 200 Database error in result
  ```json
  { "result": "The INSERT statement conflicted with the FOREIGN KEY constraint." }
  ```
