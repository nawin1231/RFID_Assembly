info:
  name: Get All Mock Lot
  type: http
  seq: 2

http:
  method: GET
  url: "{{urlPrefix}}/api/assembly/mock-done"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  List all lots in the mock-done list, newest first.

  ### 200 With rows
  ```json
  [
    { "id": 2, "lot_no": "DEMO000002", "created_at": "2026-09-29T10:05:00.000Z" },
    { "id": 1, "lot_no": "DEMO000001", "created_at": "2026-09-29T10:00:00.000Z" }
  ]
  ```

  ### 200 Empty
  ```json
  []
  ```

  ### 500 Database error
  ```json
  { "error": "Invalid object name 'tb_assy_mock_done'." }
  ```
