info:
  name: Process - Update
  type: http
  seq: 11

http:
  method: PUT
  url: "{{urlPrefix}}/api/assembly/process/1"
  body:
    type: json
    data: |-
      {
        "process_code": "9999",
        "process_name": "Test Process Updated",
        "can_clear_tag": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Update a process by id. Updating an id that does not exist still returns OK.
  `can_clear_tag` (boolean) says if lots in this process can be cleared on the Clear Tag page.
  A database error comes back as HTTP 200 with the message in `result`.

  ### 200 Updated
  ```json
  { "result": "OK" }
  ```

  ### 200 Database error in result
  ```json
  { "result": "Cannot insert duplicate key row in object 'dbo.tb_master_process'." }
  ```
