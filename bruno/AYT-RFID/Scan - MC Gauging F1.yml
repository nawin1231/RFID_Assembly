info:
  name: Scan - MC Gauging F1
  type: http
  seq: 22

http:
  method: POST
  url: "{{urlPrefix}}/api/assembly/mc-gauging-f1"
  body:
    type: json
    data: |-
      {
        "tag_id": "E280116000000001",
        "location_name": "MC GAUGING F1"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  A tag is scanned at the MC Gauging F1 reader. Moves the lot to status 3 (MC Gauging F1).
  The reader service calls this route. `location_name` is optional.
  Business errors come back as HTTP 200 with a code in `result`.

  ### 200 Moved
  ```json
  { "result": "OK" }
  ```

  ### 200 Tag unknown
  ```json
  { "result": "TAG_NOT_FOUND" }
  ```

  ### 200 Lot is not at the right step
  ```json
  { "result": "INVALID_PROCESS" }
  ```

  ### 500 Database error
  ```json
  { "error": "Failed to connect to database" }
  ```
