info:
  name: Status - List
  type: http
  seq: 5

http:
  method: GET
  url: "{{urlPrefix}}/api/assembly/status"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  List lot statuses with their process.

  ### 200 With rows
  ```json
  [
    { "id": 1, "status": "bf_issue", "label_status": "Before Issue", "process_id": 1, "process_code": "1400", "process_name": "BEFORE ISSUE" },
    { "id": 2, "status": "gr_f1", "label_status": "Gauging Room F1", "process_id": 2, "process_code": "1500", "process_name": "GAUGING" },
    { "id": 3, "status": "mc_f1", "label_status": "MC Gauging F1", "process_id": 2, "process_code": "1500", "process_name": "GAUGING" },
    { "id": 4, "status": "completed", "label_status": "Completed", "process_id": null, "process_code": null, "process_name": null }
  ]
  ```

  ### 200 Empty
  ```json
  []
  ```

  ### 500 Database error
  ```json
  { "error": "Failed to connect to database" }
  ```
