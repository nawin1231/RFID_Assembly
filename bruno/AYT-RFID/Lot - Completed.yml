info:
  name: Lot - Completed
  type: http
  seq: 24

http:
  method: POST
  url: "{{urlPrefix}}/api/assembly/completed"
  body:
    type: json
    data: |-
      {
        "lot_no": "DEMO000001",
        "remark": "Finished",
        "emp_id": "MOCK001",
        "machine_no": "MC-01"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Mark a lot as Completed (status 4) and clear (release) its tag. Only a lot at status 3 (MC Gauging F1) can complete.
  `remark`, `emp_id` and `machine_no` are optional. Business errors come back as HTTP 200 with a code in `result`.

  ### 200 Completed
  ```json
  { "result": "OK" }
  ```

  ### 200 Lot unknown
  ```json
  { "result": "LOT_NOT_FOUND" }
  ```

  ### 200 Lot is not at status 3
  ```json
  { "result": "INVALID_PROCESS" }
  ```

  ### 200 Status 4 missing in master data
  ```json
  { "result": "INVALID_STATUS" }
  ```

  ### 500 Database error
  ```json
  { "error": "Failed to connect to database" }
  ```
