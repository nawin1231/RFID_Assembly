info:
  name: Status - Update
  type: http
  seq: 7

http:
  method: PUT
  url: "{{urlPrefix}}/api/assembly/status/1"
  body:
    type: json
    data: |-
      {
        "status": "test_status",
        "label_status": "Test Status Updated",
        "process_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Update a status by id. Updating an id that does not exist still returns OK.
  A database error comes back as HTTP 200 with the message in `result`.

  ### 200 Updated
  ```json
  { "result": "OK" }
  ```

  ### 200 Database error in result
  ```json
  { "result": "The UPDATE statement conflicted with the FOREIGN KEY constraint." }
  ```
