info:
  name: Get One lot
  type: http
  seq: 1

http:
  method: GET
  url: "{{urlPrefix}}/api/assembly/lot/{{lot_no}}"
  auth: inherit

runtime:
  variables:
    - name: lot_no
      value: DEMO000001

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Fetch a lot from the upstream receive API (AS400) by lot number. Nothing is stored.

  ### 200 Found
  ```json
  {
    "lot_no": "DEMO000001",
    "wos": "WOS2609001",
    "brg_type": "6204ZZCM",
    "spec": "SPEC-6204",
    "qty": 500
  }
  ```

  ### 404 Lot not found
  ```json
  { "error": "LOT_NOT_FOUND" }
  ```

  ### 500 Upstream error
  ```json
  { "error": "Request failed with status code 500" }
  ```
