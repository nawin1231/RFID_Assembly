info:
  name: User - List
  type: http
  seq: 14

http:
  method: GET
  url: "{{urlPrefix}}/api/assembly/login/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  List all users. No password field.

  ### 200 With rows
  ```json
  [
    { "id": 1, "emp_id": "MOCK001", "eng_name": "DEMO", "eng_surname": "ADMIN", "position": "admin" },
    { "id": 2, "emp_id": "MOCK002", "eng_name": "DEMO", "eng_surname": "OPERATOR", "position": "user" }
  ]
  ```

  ### 200 Empty
  ```json
  []
  ```

  ### 500 Database error
  ```json
  { "error": "Failed to connect to database" }
  ```
