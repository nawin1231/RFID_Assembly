info:
  name: Dashboard - History
  type: http
  seq: 30

http:
  method: GET
  url: "{{urlPrefix}}/api/assembly/dashboard/history"
  params:
    - name: date_from
      value: 2026-09-29
      type: query
    - name: date_to
      value: 2026-09-29
      type: query
    - name: brg_type
      value: 6204ZZCM
      type: query
      disabled: true
    - name: wos
      value: WOS2609001
      type: query
      disabled: true
    - name: lot_no
      value: DEMO000001
      type: query
      disabled: true
    - name: status_id
      value: "1"
      type: query
      disabled: true
    - name: location_name
      value: GAUGING ROOM F1
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Lot history rows for active lots (status not Completed), newest first, at most 200 rows.
  All query params are optional. Text params match by "contains".

  ### 200 With rows
  ```json
  [
    {
      "tag_id": "E280116000000001",
      "lot_no": "DEMO000001",
      "wos": "WOS2609001",
      "qty": 500,
      "status_id": 2,
      "label_status": "Gauging Room F1",
      "brg_type": "6204ZZCM",
      "spec": "SPEC-6204",
      "location_name": "GAUGING ROOM F1",
      "machine_no": null,
      "emp_id": "MOCK001",
      "remark": null,
      "created_at": "2026-09-29T10:00:00.000Z",
      "updated_at": "2026-09-29T10:30:00.000Z"
    }
  ]
  ```

  ### 200 Empty
  ```json
  []
  ```

  ### 500 Database error
  ```json
  { "error": "Failed to connect to database" }
  ```
